    <!--
      GDD §16 type: Bungee for display, Space Mono for numbers. Both are self-hosted — the
      @font-face rules and the files are in src/theme/tokens.css and src/assets/fonts — so the
      game makes no third-party request, needs no preconnect, and cannot be held up or tracked by
      a font CDN. font-display: swap plus a real fallback stack and fixed line-heights means a
      face that fails to load still costs the layout nothing; only the letterforms change.
    -->
  </head>

    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
